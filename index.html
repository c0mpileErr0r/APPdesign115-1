<div class="app" id="appRoot" hidden>
<aside><div class="brand"><span class="logo">日</span><span>日序 <small style="font-size:10px;color:#93a096;font-weight:500">DAYFLOW</small></span></div><div class="nav-label">工作空間</div><nav class="nav"><button class="active" data-view="today" aria-current="page"><span class="ico">◷</span><span class="nav-text">今日總覽</span></button><button data-view="events" aria-current="false"><span class="ico">▦</span><span class="nav-text">行程</span></button><button data-view="tasks" aria-current="false"><span class="ico">☑</span><span class="nav-text">待辦任務</span></button></nav><div class="side-note">讓每一天，都更有方向。</div></aside>
<main class="main"><div class="topbar"><div class="crumb">我的工作空間　/　<span id="crumbCurrent">今日總覽</span></div><div class="top-actions"><button class="icon-btn" id="todayBtn" title="回到今天">⌂ 今天</button><div id="accountMenu"></div></div></div>
<div class="welcome"><div><div class="eyebrow" id="dateText">星期四，10月30日</div><h1 id="headline">早安，今天也會很順利。</h1><p>把注意力留給當下，一步一步完成今天。</p></div><button class="primary" id="addBtn">＋ 新增項目</button></div>
<section class="reminder-strip" id="reminderStrip" aria-live="polite"></section><section class="summary"><div class="stat"><div><div class="stat-label">今日行程</div><div class="stat-num" id="eventCount">行程</div></div><div class="stat-icon">▦</div></div><div class="stat"><div><div class="stat-label">待辦任務</div><div class="stat-num" id="taskCount">任務</div></div><div class="stat-icon">☑</div></div></section>

<div class="right-col"><section class="panel"><div class="panel-head"><div><h2>待辦任務</h2><p>專注完成最重要的事</p></div><button class="text-btn" data-go="tasks">查看全部 →</button></div><div class="task-list" id="taskList"></div></section></div></div>
