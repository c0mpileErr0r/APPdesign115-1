name: Publish DAYFLOW to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Inject Firebase config into index.html
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const rawConfig = process.env.FIREBASE_CONFIG_JSON || '';
          if (!rawConfig.trim()) {
            throw new Error('FIREBASE_CONFIG_JSON secret is empty or unavailable');
          }
          const required = ['apiKey', 'authDomain', 'projectId', 'appId'];
          let config;
          try {
            config = JSON.parse(rawConfig);
            if (typeof config === 'string') config = JSON.parse(config);
          } catch {
            config = {};
          }
          if (!config || typeof config !== 'object' || Array.isArray(config)) {
            config = {};
          }
          for (const key of required) {
            if (typeof config[key] !== 'string' || !config[key].trim()) {
              const pattern = new RegExp(key + "\\s*:\\s*[\"']([^\"']+)[\"']");
              const match = rawConfig.match(pattern);
              if (match) config[key] = match[1].trim();
            }
            if (typeof config[key] !== 'string' || !config[key].trim()) {
              throw new Error(`FIREBASE_CONFIG_JSON is missing a valid ${key} value`);
            }
          }
          const html = fs.readFileSync('index.html', 'utf8');
          const placeholder = '__FIREBASE_CONFIG_JSON__';
          if (!html.includes(placeholder)) {
            throw new Error(`Placeholder ${placeholder} was not found in index.html`);
          }
          fs.writeFileSync('index.html', html.replace(placeholder, JSON.stringify(config)));
          NODE
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
